name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: python -m pip install . pytest 'marimo>=0.23.14'
      - name: Package and documentation tests
        run: python -m pytest -q
      - name: Check notebook graphs
        run: |
          python -m marimo check examples/gasoline_price_trends.py
          python -m marimo check examples/pvdaq4_degradation.py
      - name: Run exogenous example
        run: python examples/lagged_exogenous_response.py
