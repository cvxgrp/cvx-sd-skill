[project]
name = "signaldecomp"
version = "0.1.0"
description = "Convex signal decomposition for scalar time series, built on cvxpy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.2",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signaldecomp"]

[dependency-groups]
dev = ["pytest>=8.0"]
examples = [
    "marimo>=0.23.14",
]

[tool.uv]
default-groups = ["dev", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
